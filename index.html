<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Oman Quick Burger — order burgers, combos, pizza and more directly on WhatsApp." />
  <title>Oman Quick Burger | Quick Order Menu</title>

  <!-- PWA & Mobile App Meta -->
  <meta name="theme-color" content="#0f1115" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Oman Quick Burger" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <div>
        <h1 id="storeName">Oman Quick Burger</h1>
        <p class="subtitle" id="storeSubtitle">Tap + to add items and order directly on WhatsApp</p>
      </div>
      <div class="header-actions">
        <div class="lang-switch" role="group" aria-label="Language Switcher">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="ar">العربية</button>
        </div>
        <span class="status-badge" id="itemCounterBadge">0 Items</span>
      </div>
    </div>

    <div class="toolbar-row">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search items..." />
      </div>
      <select id="sortSelect" class="sort-select" aria-label="Sort items">
        <option value="default">Default Order</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name-asc">Name: A - Z</option>
      </select>
    </div>

    <div class="sub-toolbar">
      <nav class="category-tabs" id="categoryTabs"></nav>
    </div>
  </header>

  <main class="container">
    <section class="menu-grid" id="menuGrid"></section>
    <div class="load-more-wrap hidden" id="loadMoreWrap">
      <button type="button" class="btn-secondary" id="loadMoreBtn">Load More Items</button>
    </div>
  </main>

  <!-- Floating Cart Bar -->
  <div class="floating-cart-bar hidden" id="floatingCartBar">
    <div class="cart-summary-info">
      <span id="cartItemCount">0 Items</span>
      <strong id="cartTotalPreview">0.000 OMR</strong>
    </div>
    <button type="button" class="btn-primary" id="openCartBtn">Order Now</button>
  </div>

  <!-- Customization Modal -->
  <div class="modal-overlay hidden" id="customModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalItemTitle">Customize Item</h3>
        <button type="button" class="close-btn" id="closeCustomModal">&times;</button>
      </div>
      <img id="modalItemImg" class="modal-item-img hidden" alt="Item photo" />
      <p class="modal-desc" id="modalItemDesc"></p>

      <div class="addons-section hidden" id="modalVariantsSection">
        <h4 id="variantsHeading">Select Price / Size</h4>
        <div id="modalVariantsList" class="variant-modal-list"></div>
      </div>

      <div class="addons-section">
        <h4 id="addonsHeading">Extra Toppings / Sauces (Optional)</h4>
        <div id="addonsList" class="addons-list"></div>
      </div>

      <div class="note-section">
        <label for="itemNote" id="lblItemNote">Special Instructions</label>
        <input type="text" id="itemNote" placeholder="e.g. No onions, extra garlic sauce..." />
      </div>

      <div class="modal-footer">
        <div class="qty-control">
          <button type="button" id="modalQtyMinus">-</button>
          <span id="modalQtyValue">1</span>
          <button type="button" id="modalQtyPlus">+</button>
        </div>
        <button type="button" class="btn-primary" id="confirmAddBtn">Add to Order</button>
      </div>
    </div>
  </div>

  <!-- Quick Checkout Modal -->
  <div class="modal-overlay hidden" id="checkoutModal">
    <div class="modal-box checkout-box">
      <div class="modal-header">
        <h3 id="checkoutTitle">Complete Your Order</h3>
        <button type="button" class="close-btn" id="closeCheckoutModal">&times;</button>
      </div>

      <div id="cartItemsContainer" class="cart-items-list"></div>

      <div class="checkout-form">
        <div class="form-group">
          <label id="lblOrderType">Order Type</label>
          <div class="radio-group">
            <label class="radio-card">
              <input type="radio" name="orderType" value="Delivery" checked />
              <span id="lblDeliveryOption">Delivery (Free)</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="orderType" value="Pickup" />
              <span id="lblPickupOption">Pickup (Free)</span>
            </label>
          </div>
        </div>

        <div class="form-group" id="addressGroup">
          <div class="location-label-row">
            <label id="lblCustomerAddress">Delivery Location *</label>
            <button type="button" class="btn-location" id="shareLocationBtn">📍 Share Live Location</button>
          </div>
          <input type="text" id="customerAddress" placeholder="Tap 'Share Live Location'..." readonly />
          <div class="location-status hidden" id="locationStatus"></div>
        </div>

        <div class="form-group">
          <label for="orderNote" id="lblOrderNote">Notes (Optional)</label>
          <input type="text" id="orderNote" placeholder="Any extra note..." />
        </div>
      </div>

      <div class="bill-breakdown">
        <div class="bill-row">
          <span id="lblSubtotal">Subtotal</span>
          <span id="subtotalAmount">0.000 OMR</span>
        </div>
        <div class="bill-row">
          <span id="lblDeliveryFee">Delivery</span>
          <span id="deliveryAmount">Free</span>
        </div>
        <div class="bill-row total">
          <span id="lblGrandTotal">Total Bill</span>
          <span id="grandTotalAmount">0.000 OMR</span>
        </div>
      </div>

      <button type="button" class="btn-whatsapp" id="sendWhatsappBtn">
        Send Order on WhatsApp
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
